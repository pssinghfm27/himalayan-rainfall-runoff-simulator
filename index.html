<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1520">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CHIRAG Hydro">
<meta name="description" content="CHIRAG Springshed Hydrology Simulator">
<title>CHIRAG Springshed Simulator</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0b1520; --panel: #101e30; --border: #1a3055; --accent: #00c9a7; --accent-dim: #007a66;
  --water: #2196f3; --rain: #90caf9; --soil: #5d4037; --soil-lt: #8d6e63;
  --evap: #ff7043; --perc: #4dd0e1; --runoff: #ffa726; --spring: #00e5ff;
  --veg: #66bb6a; --trench: #ab47bc; --pit: #26a69a; --rock1: #78909c;
  --rock2: #a1887f; --rock3: #90a4ae;
  --text: #e0e8f0; --dim: #7a8fa6; --danger: #ef5350; --success: #66bb6a;
  --mono: 'JetBrains Mono','Fira Code',monospace;
  --disp: 'Playfair Display',Georgia,serif;
  --body: 'DM Sans','Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;padding:10px 10px 90px}
.P{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:13px;margin-bottom:9px}
.hdr{text-align:center;padding:10px 0 12px}
.hdr-tag{font-size:8px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;font-family:var(--mono);margin-bottom:3px}
.hdr h1{font-family:var(--disp);font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--spring));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.2}
.hdr-sub{font-size:9.5px;color:var(--dim);margin-top:2px}
.gauges{display:flex;justify-content:space-around;padding:8px 2px}
.sg{margin-bottom:11px}
.sg-h{display:flex;justify-content:space-between;margin-bottom:3px}
.sg-l{font-size:10.5px;color:var(--dim)}
.sg-v{font-size:10.5px;font-family:var(--mono);font-weight:600}
input[type=range]{width:100%;height:4px;-webkit-appearance:none;appearance:none;border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);cursor:pointer}
.tabs{display:flex;gap:2px;margin-bottom:9px;background:var(--panel);border-radius:9px;padding:3px}
.tb{flex:1;padding:7px 0;border:none;border-radius:7px;cursor:pointer;font-family:var(--body);font-size:10px;font-weight:400;background:transparent;color:var(--dim);transition:all .2s}
.tb.a{background:var(--accent);color:var(--bg);font-weight:700}
.ctrls{display:flex;gap:5px;padding:7px;justify-content:center;align-items:center;flex-wrap:wrap}
.btn-r{padding:9px 20px;border:none;border-radius:8px;cursor:pointer;font-family:var(--mono);font-size:12px;font-weight:700;transition:all .2s}
.btn-r.on{background:var(--danger);color:#fff}.btn-r.off{background:var(--accent);color:var(--bg)}
.btn-s{padding:7px 12px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--dim);cursor:pointer;font-family:var(--mono);font-size:10px}
.sel{padding:7px;border:1px solid var(--border);border-radius:7px;background:var(--panel);color:var(--text);font-family:var(--mono);font-size:10px}
.tdisp{font-size:9px;color:var(--dim);font-family:var(--mono)}
.sb{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.sbb{padding:6px 8px;border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:9px;transition:all .15s;background:transparent;min-width:0;flex:1;text-align:center;white-space:nowrap}
.sbb.a{border-color:var(--accent)!important;color:var(--accent);background:rgba(0,201,167,.1)}
.wb-bar{display:flex;height:13px;border-radius:7px;overflow:hidden;margin-bottom:5px}
.wb-bar>div{transition:width .5s;min-width:1px}
.wbl{display:flex;flex-wrap:wrap;gap:6px}.wbl-i{display:flex;align-items:center;gap:3px;font-size:8.5px;color:var(--dim)}
.wbl-d{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.cr{margin-bottom:9px}.cr-h{display:flex;justify-content:space-between;margin-bottom:2px}
.cr-l{font-size:9.5px;color:var(--dim)}.cr-v{font-size:10.5px;font-family:var(--mono);font-weight:600}
.ib{margin-top:7px;padding:9px;background:var(--bg);border-radius:7px;font-size:9.5px;color:var(--dim);line-height:1.55}
.ib-t{font-family:var(--mono);color:var(--accent);margin-bottom:3px;font-size:9px}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:9.5px}
.ig-i{color:var(--dim)}.ig-v{font-family:var(--mono)}
.ft{padding:9px;border-radius:7px;margin-top:7px;background:rgba(16,30,48,.5);border:1px solid rgba(26,48,85,.3);font-size:7.5px;color:var(--dim);font-family:var(--mono);line-height:1.5;text-align:center}
.sec-t{font-size:9.5px;color:var(--accent);font-family:var(--mono);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.rock-layer{padding:8px;border-radius:7px;margin-bottom:7px;border:1px solid var(--border)}
.rock-layer .rl-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.rl-label{font-size:10px;font-weight:600;font-family:var(--mono)}
.rl-depth{font-size:9px;color:var(--dim);font-family:var(--mono)}
.inst-ban{position:fixed;bottom:0;left:0;right:0;z-index:100;background:linear-gradient(135deg,#101e30,#152a4a);border-top:1px solid var(--accent);padding:12px 14px;display:none;animation:sU .4s}
.inst-ban.show{display:flex;align-items:center;gap:10px}
.inst-t{flex:1}.inst-tt{font-size:12px;font-weight:600}.inst-ts{font-size:9px;color:var(--dim);margin-top:2px}
.inst-b{padding:7px 16px;border:none;border-radius:7px;background:var(--accent);color:var(--bg);font-weight:700;font-family:var(--body);font-size:11px;cursor:pointer}
.inst-x{background:none;border:none;color:var(--dim);cursor:pointer;font-size:16px;padding:4px}
@keyframes sU{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes rain{0%{transform:translateY(-20px);opacity:0}10%{opacity:1}100%{transform:translateY(120px);opacity:0}}
@keyframes sFlow{0%{transform:translateX(0);opacity:1}100%{transform:translateX(15px);opacity:0}}
@keyframes evR{0%{transform:translateY(0);opacity:.6}100%{transform:translateY(-30px);opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<div class="inst-ban" id="instBan">
  <div class="inst-t"><div class="inst-tt">💧 Install CHIRAG Hydro</div><div class="inst-ts">Works offline in the field</div></div>
  <button class="inst-b" id="instBtn">Install</button>
  <button class="inst-x" id="instX">✕</button>
</div>

<script>
// ═══════════════════════════════════════════════════
// GSI UTTARAKHAND ROCK DATA
// ═══════════════════════════════════════════════════
const ROCKS = {
  quartzite:    { name:'Quartzite', Kh:0.001, porosity:0.02, fracturePerm:0.5, color:'#78909c',
    desc:'Hard metamorphic, common in Lesser Himalaya (Chandpur/Nagthat Fm)' },
  limestone:    { name:'Limestone', Kh:0.05, porosity:0.12, fracturePerm:2.5, color:'#bcaaa4',
    desc:'Carbonate rock, karst potential (Mussoorie/Tejam Group)' },
  dolomite:     { name:'Dolomite', Kh:0.03, porosity:0.10, fracturePerm:2.0, color:'#d7ccc8',
    desc:'Carbonate, Pithoragarh/Gangolihat Dolomite, good aquifer' },
  slate:        { name:'Slate/Phyllite', Kh:0.0005, porosity:0.015, fracturePerm:0.3, color:'#546e7a',
    desc:'Low-grade metamorphic, Chandpur Formation, poor aquifer' },
  gneiss:       { name:'Gneiss', Kh:0.0008, porosity:0.01, fracturePerm:0.4, color:'#90a4ae',
    desc:'High-grade metamorphic, Central Crystallines (Munsiari Fm)' },
  schist:       { name:'Schist', Kh:0.002, porosity:0.03, fracturePerm:0.6, color:'#80cbc4',
    desc:'Metamorphic, Almora/Ramgarh Group, moderate fracture flow' },
  sandstone:    { name:'Sandstone', Kh:0.1, porosity:0.18, fracturePerm:1.0, color:'#ffab91',
    desc:'Siwalik Group (Upper/Middle), good primary porosity' },
  shale:        { name:'Shale', Kh:0.0001, porosity:0.05, fracturePerm:0.1, color:'#8d6e63',
    desc:'Siwalik/Krol Group, aquitard/confining layer' },
  granite:      { name:'Granite', Kh:0.0003, porosity:0.008, fracturePerm:0.35, color:'#b0bec5',
    desc:'Intrusive igneous, localized in Higher Himalaya' },
  colluvium:    { name:'Colluvium/Debris', Kh:5.0, porosity:0.30, fracturePerm:0, color:'#a1887f',
    desc:'Unconsolidated slope deposits, high permeability top layer' },
  laterite:     { name:'Laterite Soil', Kh:2.0, porosity:0.35, fracturePerm:0, color:'#e57373',
    desc:'Weathered residual soil, common mantling in Kumaon hills' },
};

// ═══════════════════════════════════════════════════
// UTTARAKHAND VEGETATION DATA
// ═══════════════════════════════════════════════════
const VEGETATION = {
  banj_oak:     { name:'Banj Oak (Quercus leucotrichophora)', Kc:0.95, rootDepth:3.0, interception:0.25,
    desc:'1500-2200m, excellent water retention, CHIRAG priority species' },
  chir_pine:    { name:'Chir Pine (Pinus roxburghii)', Kc:0.65, rootDepth:1.5, interception:0.12,
    desc:'900-1800m, low water retention, fire-prone, needle litter repels water' },
  rhododendron: { name:'Rhododendron (Burans)', Kc:0.80, rootDepth:1.2, interception:0.18,
    desc:'1800-3000m, moderate retention, common understory' },
  mixed_broad:  { name:'Mixed Broadleaf', Kc:0.90, rootDepth:2.5, interception:0.22,
    desc:'Kafal, Utis (Alder), Bhimal — good multi-story canopy' },
  sal:          { name:'Sal (Shorea robusta)', Kc:0.85, rootDepth:2.0, interception:0.20,
    desc:'Below 1000m (Terai/Bhabar), deciduous, good litter cover' },
  ringal:       { name:'Ringal Bamboo', Kc:0.70, rootDepth:0.8, interception:0.15,
    desc:'1800-2800m, dense understory, slope stabilization' },
  grassland:    { name:'Alpine/Sub-alpine Grassland', Kc:0.55, rootDepth:0.4, interception:0.08,
    desc:'Bugyal grasslands above 3000m, shallow roots' },
  scrubland:    { name:'Degraded Scrubland', Kc:0.35, rootDepth:0.3, interception:0.05,
    desc:'Degraded areas, poor water retention, high runoff' },
  plantation:   { name:'Mixed Plantation (CHIRAG)', Kc:0.88, rootDepth:2.2, interception:0.20,
    desc:'CHIRAG plantation mix: Oak + Kafal + Utis + fruit trees' },
  barren:       { name:'Barren/Rocky', Kc:0.15, rootDepth:0, interception:0.01,
    desc:'Exposed rock/soil, maximum runoff' },
};

// ═══════════════════════════════════════════════════
// HYDROLOGY ENGINE v2
// ═══════════════════════════════════════════════════
const SOILS = {
  sandy:    { Ks:50, por:0.43, fc:0.15, wp:0.05, CN:65 },
  loam:     { Ks:13, por:0.45, fc:0.27, wp:0.11, CN:73 },
  clay:     { Ks:2,  por:0.50, fc:0.36, wp:0.20, CN:82 },
  siltyLoam:{ Ks:7,  por:0.47, fc:0.32, wp:0.14, CN:78 },
};

class SpringshedModel {
  constructor(p) {
    // Catchment in m²
    this.areaM2 = p.areaM2 || 50000;
    this.slope = p.slope || 15;
    this.soilType = p.soilType || 'loam';
    this.vegType = p.vegType || 'banj_oak';
    this.rainfall = p.rainfall || 0; // mm/hr
    this.temperature = p.temperature || 18;

    // Rock layers (top to bottom)
    this.rock1 = p.rock1 || 'colluvium';
    this.rock1Depth = p.rock1Depth || 3;   // metres
    this.rock2 = p.rock2 || 'quartzite';
    this.rock2Depth = p.rock2Depth || 15;
    this.rock3 = p.rock3 || 'slate';
    this.rock3Depth = p.rock3Depth || 50;

    // Interventions — volumes in m³
    this.pitVol = p.pitVol || 0;           // m³ total pit volume
    this.pitCount = p.pitCount || 0;
    this.trenchVol = p.trenchVol || 0;     // m³ total trench volume
    this.trenchLength = p.trenchLength || 0; // metres
    this.checkDamVol = p.checkDamVol || 0; // m³
    this.checkDamCount = p.checkDamCount || 0;
    this.plantationAreaM2 = p.plantationAreaM2 || 0;
    this.interventionDist = p.interventionDist || 500; // m from spring

    // State
    this.soilMoisture = p.initSM || 0.30;
    this.gwLevel = p.initGW || 0.50;
    this.springDischarge = 0;
    this.surfaceRunoff = 0; // mm/hr
    this.totalInfiltration = 0;
    this.totalEvaporation = 0;
    this.totalPercolation = 0;
    this.ts = { discharge:[], runoff:[], infiltration:[], evaporation:[], soilMoisture:[], gwLevel:[], rainfall:[] };
    this.t = 0;
  }

  soil() { return SOILS[this.soilType] || SOILS.loam; }
  veg() { return VEGETATION[this.vegType] || VEGETATION.banj_oak; }
  r1() { return ROCKS[this.rock1] || ROCKS.colluvium; }
  r2() { return ROCKS[this.rock2] || ROCKS.quartzite; }
  r3() { return ROCKS[this.rock3] || ROCKS.slate; }

  // Effective hydraulic conductivity through rock stack
  effectiveRockK() {
    const r1 = this.r1(), r2 = this.r2(), r3 = this.r3();
    const d1 = this.rock1Depth, d2 = this.rock2Depth, d3 = this.rock3Depth;
    const dTotal = d1 + d2 + d3;
    // Harmonic mean for vertical flow (series)
    const Kv = dTotal / (d1 / (r1.Kh + r1.fracturePerm) + d2 / (r2.Kh + r2.fracturePerm) + d3 / (r3.Kh + r3.fracturePerm));
    return Kv;
  }

  // Effective porosity through stack
  effectiveRockPorosity() {
    const r1 = this.r1(), r2 = this.r2(), r3 = this.r3();
    const d1 = this.rock1Depth, d2 = this.rock2Depth, d3 = this.rock3Depth;
    const dT = d1 + d2 + d3;
    return (r1.porosity * d1 + r2.porosity * d2 + r3.porosity * d3) / dT;
  }

  // Area in hectares for internal calc
  areaHa() { return this.areaM2 / 10000; }

  // Intervention storage capacity relative to catchment rainfall
  interventionStorageMM() {
    // Total storage volume in m³ → mm over catchment
    const totalVol = this.pitVol + this.trenchVol + this.checkDamVol;
    // Proximity factor: closer to spring = more effective for recharge
    const proxFactor = Math.max(0.3, 1.5 - this.interventionDist / 1000);
    return (totalVol / Math.max(1, this.areaM2)) * 1000 * proxFactor; // mm
  }

  calcRunoff(rain_mm_hr) {
    const s = this.soil();
    const v = this.veg();
    let CN = s.CN;
    // Vegetation adjustment — oak much better than pine
    CN = CN * (1 - 0.35 * v.Kc);
    // Slope correction
    const sr = this.slope * Math.PI / 180;
    CN = Math.min(98, CN * (1 + 0.5 * Math.sin(sr)));
    // Antecedent moisture
    if (this.soilMoisture > 0.7) CN = Math.min(98, CN * 1.15);
    else if (this.soilMoisture < 0.3) CN *= 0.85;
    // Rock layer effect — low porosity top layer increases runoff
    const rockTopPor = this.r1().porosity;
    if (rockTopPor < 0.05) CN = Math.min(98, CN * 1.08);

    // Interception loss by canopy
    const intercepted = rain_mm_hr * v.interception;
    const netRain = Math.max(0, rain_mm_hr - intercepted);

    // Intervention storage capture (mm)
    const intStorage = this.interventionStorageMM();

    const S = (25400 / CN) - 254;
    const Ia = 0.2 * S;
    const effRain = Math.max(0, netRain - intStorage);
    if (effRain <= Ia) return 0;
    const Q = Math.pow(effRain - Ia, 2) / (effRain - Ia + S);
    return Math.max(0, Q); // mm/hr
  }

  calcET() {
    const v = this.veg();
    const Rn = 15 + 0.5 * this.temperature;
    const g = 0.066;
    const es = 0.6108 * Math.exp((17.27 * this.temperature) / (this.temperature + 237.3));
    const ea = es * 0.65; // ~65% RH typical Kumaon hills
    const d = (4098 * es) / Math.pow(this.temperature + 237.3, 2);
    let ET0 = (0.408 * d * Rn + g * (900 / (this.temperature + 273)) * 2 * (es - ea)) / (d + g * 1.68);
    // Vegetation-specific Kc
    const Kc = v.Kc + 0.1 * (this.plantationAreaM2 / Math.max(1, this.areaM2));
    return Math.max(0, ET0 * Kc / 24); // mm/hr
  }

  calcInfiltration(rain_mm_hr) {
    const s = this.soil();
    const v = this.veg();
    const avPor = s.por - this.soilMoisture * s.por;
    const psi = 150 * (1 - this.soilMoisture);
    const netRain = Math.max(0, rain_mm_hr * (1 - v.interception));
    let F = s.Ks * (1 + (psi * avPor) / Math.max(1, netRain));

    // Root depth effect — deeper roots = better macropore infiltration
    const rootBoost = 1 + v.rootDepth * 0.05;

    // Intervention boost from pit & trench volume
    const volBoost = 1 + (this.pitVol + this.trenchVol) / Math.max(100, this.areaM2) * 2;

    // Rock top layer — if high-K colluvium on top, infiltration is good
    const rockBoost = 1 + Math.min(0.3, this.r1().Kh * 0.02);

    return Math.max(0, Math.min(netRain, F * rootBoost * volBoost * rockBoost));
  }

  calcDeepPerc() {
    const s = this.soil();
    const ex = Math.max(0, this.soilMoisture - s.fc / s.por);
    let p = s.Ks * ex * 0.3;
    // Slope effect
    p *= Math.max(0.3, 1 - 0.02 * this.slope);
    // Rock permeability governs deep percolation rate
    const rockK = this.effectiveRockK();
    const rockFactor = Math.min(3, rockK / 0.5);
    p *= Math.max(0.1, rockFactor);
    // Intervention enhancement — pits and trenches hold water longer for percolation
    const proxFactor = Math.max(0.3, 1.5 - this.interventionDist / 1000);
    p += (this.pitVol * 0.008 + this.trenchVol * 0.005 + this.checkDamVol * 0.01) * proxFactor;
    return Math.max(0, p); // mm/hr
  }

  calcSpringQ() {
    const aHa = this.areaHa();
    const rockK = this.effectiveRockK();
    const rockPor = this.effectiveRockPorosity();
    // Transmissivity-based discharge
    const T = rockK * (this.rock1Depth + this.rock2Depth); // m²/hr approx
    const base = 0.015 * Math.pow(this.gwLevel, 1.5) * aHa * 10 * (1 + T * 0.1);

    // Fracture contribution from layer 2 (main aquifer usually)
    const fracContrib = this.r2().fracturePerm * 0.005 * this.gwLevel * aHa;

    // Intervention sustained recharge
    const proxFactor = Math.max(0.3, 1.5 - this.interventionDist / 1000);
    const intFactor = 1 +
      (this.pitVol * 0.0005 + this.trenchVol * 0.0003 + this.checkDamVol * 0.0008) * proxFactor +
      (this.plantationAreaM2 / Math.max(1, this.areaM2)) * 0.12;

    return Math.max(0, (base + fracContrib) * intFactor); // L/s
  }

  step(dt) {
    const s = this.soil();
    const ET = this.calcET() * dt;
    const inf = this.calcInfiltration(this.rainfall);
    const ro = this.calcRunoff(this.rainfall);
    const dp = this.calcDeepPerc() * dt;

    const mIn = inf * dt / (s.por * 1000);
    const mOut = (ET + dp) / (s.por * 1000);
    this.soilMoisture = Math.max(0.05, Math.min(0.95, this.soilMoisture + mIn - mOut));

    const rockPor = this.effectiveRockPorosity();
    const gwR = dp / (500 * Math.max(0.01, rockPor) * 3);
    const gwD = this.springDischarge / (this.areaHa() * 50);
    this.gwLevel = Math.max(0.05, Math.min(0.95, this.gwLevel + gwR - gwD));

    this.springDischarge = this.calcSpringQ();
    this.surfaceRunoff = ro;
    this.totalInfiltration = inf;
    this.totalEvaporation = ET;
    this.totalPercolation = dp;

    this.t++;
    const mx = 120;
    for (const k of Object.keys(this.ts)) { if (this.ts[k].length > mx) this.ts[k].shift(); }
    this.ts.discharge.push(this.springDischarge);
    this.ts.runoff.push(ro);
    this.ts.infiltration.push(inf);
    this.ts.evaporation.push(ET);
    this.ts.soilMoisture.push(this.soilMoisture * 100);
    this.ts.gwLevel.push(this.gwLevel * 100);
    this.ts.rainfall.push(this.rainfall);

    return { runoff:ro, infiltration:inf, evaporation:ET, percolation:dp,
      soilMoisture:this.soilMoisture, groundwaterLevel:this.gwLevel,
      springDischarge:this.springDischarge };
  }
}

// ═══════════════════════════════════════════════════
// UI STATE & RENDERER
// ═══════════════════════════════════════════════════
const S = {
  running:false, speed:500, tab:'terrain', elapsed:0,
  areaM2:50000, slope:15, soilType:'loam', vegType:'banj_oak', temperature:18,
  rainfall:0, stormMode:false,
  rock1:'colluvium', rock1Depth:3,
  rock2:'quartzite', rock2Depth:15,
  rock3:'slate', rock3Depth:50,
  pitVol:0, pitCount:0, trenchVol:0, trenchLength:0,
  checkDamVol:0, checkDamCount:0, plantationAreaM2:0, interventionDist:500,
  results:{ runoff:0,infiltration:0,evaporation:0,percolation:0,soilMoisture:0.3,groundwaterLevel:0.5,springDischarge:0 },
  model:null, interval:null,
};

function mkModel() {
  return new SpringshedModel({
    areaM2:S.areaM2, slope:S.slope, soilType:S.soilType, vegType:S.vegType, temperature:S.temperature,
    rock1:S.rock1, rock1Depth:S.rock1Depth, rock2:S.rock2, rock2Depth:S.rock2Depth,
    rock3:S.rock3, rock3Depth:S.rock3Depth,
    pitVol:S.pitVol, pitCount:S.pitCount, trenchVol:S.trenchVol, trenchLength:S.trenchLength,
    checkDamVol:S.checkDamVol, checkDamCount:S.checkDamCount,
    plantationAreaM2:S.plantationAreaM2, interventionDist:S.interventionDist,
    initSM:0.3, initGW:0.5,
  });
}

function sync() {
  const m = S.model; if(!m) return;
  m.areaM2=S.areaM2; m.slope=S.slope; m.soilType=S.soilType; m.vegType=S.vegType;
  m.temperature=S.temperature; m.rock1=S.rock1; m.rock1Depth=S.rock1Depth;
  m.rock2=S.rock2; m.rock2Depth=S.rock2Depth; m.rock3=S.rock3; m.rock3Depth=S.rock3Depth;
  m.pitVol=S.pitVol; m.pitCount=S.pitCount; m.trenchVol=S.trenchVol; m.trenchLength=S.trenchLength;
  m.checkDamVol=S.checkDamVol; m.checkDamCount=S.checkDamCount;
  m.plantationAreaM2=S.plantationAreaM2; m.interventionDist=S.interventionDist;
}

function tick() {
  if(!S.model) return;
  if(S.stormMode) {
    const t=S.elapsed%12;
    const sr=t<2?10+t*15:t<5?40-(t-2)*8:t<8?16-(t-5)*5:0;
    S.model.rainfall=Math.max(0,sr); S.rainfall=Math.max(0,Math.round(sr));
  }
  S.results=S.model.step(0.5);
  S.elapsed+=0.5;
  render();
}

function toggleRun() {
  S.running=!S.running;
  if(S.running) S.interval=setInterval(tick,S.speed);
  else clearInterval(S.interval);
  render();
}

function resetSim() {
  S.running=false; clearInterval(S.interval); S.elapsed=0;
  S.results={runoff:0,infiltration:0,evaporation:0,percolation:0,soilMoisture:0.3,groundwaterLevel:0.5,springDischarge:0};
  S.model=mkModel();
  if(!S.stormMode) S.model.rainfall=S.rainfall;
  render();
}

function setTab(t){S.tab=t;render();}

// ─── SVG Helpers ──────────────────────────────────
function gauge(v,mx,c,u){
  const p=Math.min(1,v/mx),C=2*Math.PI*38,off=C*(1-p*0.75);
  return `<svg width="85" height="72" viewBox="0 0 90 80">
    <path d="M 10 65 A 38 38 0 1 1 80 65" fill="none" stroke="var(--border)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 10 65 A 38 38 0 1 1 80 65" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C*.75}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .5s"/>
    <text x="45" y="40" text-anchor="middle" fill="${c}" style="font-size:13px;font-family:var(--mono);font-weight:700">${v.toFixed(2)}</text>
    <text x="45" y="53" text-anchor="middle" fill="var(--dim)" style="font-size:7.5px;font-family:var(--body)">${u}</text>
  </svg>`;
}

function mchart(d,c,l,u,mx){
  if(!d||d.length<2) return `<div class="cr"><div class="cr-h"><span class="cr-l">${l}</span><span class="cr-v" style="color:${c}">— ${u}</span></div></div>`;
  const M=mx||Math.max(...d,.01),w=200,h=55;
  const pts=d.map((v,i)=>`${(i/(d.length-1))*w},${h-(v/M)*h*.88-2}`).join(' ');
  const cur=d[d.length-1];
  return `<div class="cr"><div class="cr-h"><span class="cr-l">${l}</span><span class="cr-v" style="color:${c}">${cur.toFixed(2)} ${u}</span></div>
    <svg width="100%" viewBox="0 0 ${w} ${h}" style="display:block">
    <defs><linearGradient id="g-${l.replace(/\s/g,'')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${c}" stop-opacity=".3"/><stop offset="100%" stop-color="${c}" stop-opacity=".02"/></linearGradient></defs>
    <polygon points="0,${h} ${pts} ${w},${h}" fill="url(#g-${l.replace(/\s/g,'')})"/>
    <polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.5" stroke-linecap="round"/>
    </svg></div>`;
}

function slider(id,l,v,mn,mx,st,u,c){
  const p=((v-mn)/(mx-mn))*100;const cl=c||'var(--accent)';
  return `<div class="sg"><div class="sg-h"><span class="sg-l">${l}</span><span class="sg-v" style="color:${cl}">${v} ${u}</span></div>
    <input type="range" id="${id}" min="${mn}" max="${mx}" step="${st}" value="${v}" style="background:linear-gradient(to right,${cl} ${p}%,var(--border) ${p}%)"></div>`;
}

function rockSelect(layer,current,depthId,depthVal){
  const opts = Object.keys(ROCKS).map(k=>`<option value="${k}" ${current===k?'selected':''}>${ROCKS[k].name}</option>`).join('');
  const r = ROCKS[current];
  return `<div class="rock-layer" style="border-color:${r.color}40">
    <div class="rl-h"><span class="rl-label" style="color:${r.color}">Layer ${layer}</span>
    <span class="rl-depth">${r.Kh+r.fracturePerm > 1 ? '🟢 High K' : r.Kh+r.fracturePerm > 0.3 ? '🟡 Moderate K' : '🔴 Low K'}</span></div>
    <select id="rock${layer}" class="sel" style="width:100%;margin-bottom:5px">${opts}</select>
    ${slider(depthId,'Thickness',depthVal, layer===1?1:5, layer===3?100:layer===2?50:15, layer===1?0.5:1, 'm', r.color)}
    <div style="font-size:8px;color:var(--dim);line-height:1.4">${r.desc}<br>K<sub>h</sub>: ${r.Kh} m/hr · Porosity: ${(r.porosity*100).toFixed(1)}% · Fracture K: ${r.fracturePerm} m/hr</div>
  </div>`;
}

function crossSection() {
  const m=S.model,r=S.results; if(!m) return '';
  const sm=r.soilMoisture*100,gw=r.groundwaterLevel,sd=r.springDischarge;
  let rain='';
  if(S.rainfall>0) for(let i=0;i<Math.min(25,Math.floor(S.rainfall/3));i++){
    const x=10+Math.random()*380,d=(Math.random()*2).toFixed(2);
    rain+=`<line x1="${x}" y1="0" x2="${x}" y2="8" stroke="var(--rain)" stroke-width="1" opacity=".6" style="animation:rain 1.5s linear ${d}s infinite"/>`;
  }
  // Rock layers visualization
  const r1c=ROCKS[m.rock1]?.color||'#999',r2c=ROCKS[m.rock2]?.color||'#777',r3c=ROCKS[m.rock3]?.color||'#555';
  const dT=m.rock1Depth+m.rock2Depth+m.rock3Depth;
  const l1h=Math.max(8,(m.rock1Depth/dT)*60),l2h=Math.max(10,(m.rock2Depth/dT)*60),l3h=60-l1h-l2h>0?60-l1h-l2h:10;
  const l1y=100,l2y=l1y+l1h,l3y=l2y+l2h;

  let intv='';
  if(m.pitCount>0) intv+=`<rect x="125" y="${l1y+2}" width="10" height="${l1h-4}" rx="2" fill="var(--pit)" opacity=".7"/><text x="130" y="${l1y+l1h+10}" text-anchor="middle" fill="var(--pit)" style="font-size:5.5px;font-family:var(--body)">Pits ${m.pitVol}m³</text>`;
  if(m.trenchLength>0){for(let i=0;i<3;i++) intv+=`<line x1="${180+i*22}" y1="${l1y+3+i*3}" x2="${195+i*22}" y2="${l1y+3+i*3}" stroke="var(--trench)" stroke-width="2" stroke-dasharray="3,2"/>`;
    intv+=`<text x="210" y="${l1y+l1h+10}" text-anchor="middle" fill="var(--trench)" style="font-size:5.5px;font-family:var(--body)">Trenches ${m.trenchVol}m³</text>`;}
  if(m.plantationAreaM2>0){for(let i=0;i<3;i++) intv+=`<circle cx="${275+i*18}" cy="${95-Math.abs(1-i)*3}" r="7" fill="var(--veg)" opacity=".6"/><line x1="${275+i*18}" y1="${102-Math.abs(1-i)*3}" x2="${275+i*18}" y2="${l1y}" stroke="var(--veg)" stroke-width="1.2"/>`;
  }
  let roArrow='';
  if(r.runoff>.5) roArrow=`<polyline points="90,58 140,70 190,66 240,73 290,80 340,93" fill="none" stroke="var(--runoff)" stroke-width="2" opacity=".6" stroke-dasharray="6,3"><animate attributeName="stroke-dashoffset" values="0;-18" dur="1s" repeatCount="indefinite"/></polyline>`;
  let evA='';
  if(r.evaporation>.03) for(let i=0;i<3;i++) evA+=`<line x1="${90+i*75}" y1="${53+i*7}" x2="${90+i*75}" y2="${43+i*7}" stroke="var(--evap)" stroke-width="1" opacity=".5" style="animation:evR 2s ease ${i*.6}s infinite"/>`;

  return `<svg width="100%" viewBox="0 0 400 ${l3y+l3h+10}" style="display:block">
    <defs><linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a237e" stop-opacity=".5"/><stop offset="100%" stop-color="#0b1520" stop-opacity=".3"/></linearGradient></defs>
    <rect x="0" y="0" width="400" height="100" fill="url(#skyG)"/>
    ${rain}
    <polygon points="0,100 80,55 160,70 240,60 320,80 400,100" fill="${r1c}" stroke="${r1c}" stroke-width=".5" opacity=".7"/>
    <!-- Rock Layer 1 -->
    <rect x="0" y="${l1y}" width="400" height="${l1h}" fill="${r1c}" opacity=".5"/>
    <text x="395" y="${l1y+l1h/2+3}" text-anchor="end" fill="${r1c}" style="font-size:6px;font-family:var(--mono);opacity:.8">${ROCKS[m.rock1]?.name||''} (${m.rock1Depth}m)</text>
    <!-- Rock Layer 2 -->
    <rect x="0" y="${l2y}" width="400" height="${l2h}" fill="${r2c}" opacity=".4"/>
    <text x="395" y="${l2y+l2h/2+3}" text-anchor="end" fill="${r2c}" style="font-size:6px;font-family:var(--mono);opacity:.8">${ROCKS[m.rock2]?.name||''} (${m.rock2Depth}m)</text>
    <!-- Rock Layer 3 -->
    <rect x="0" y="${l3y}" width="400" height="${l3h}" fill="${r3c}" opacity=".3"/>
    <text x="395" y="${l3y+l3h/2+3}" text-anchor="end" fill="${r3c}" style="font-size:6px;font-family:var(--mono);opacity:.8">${ROCKS[m.rock3]?.name||''} (${m.rock3Depth}m)</text>
    <!-- GW table line -->
    <line x1="0" y1="${l2y + l2h*.4 - gw*l2h*.3}" x2="400" y2="${l2y + l2h*.4 - gw*l2h*.3}" stroke="var(--water)" stroke-width="1" stroke-dasharray="4,3" opacity=".5"/>
    <text x="5" y="${l2y + l2h*.4 - gw*l2h*.3 - 3}" fill="var(--water)" style="font-size:6px;font-family:var(--mono);opacity:.7">GW Table ${(gw*100).toFixed(0)}%</text>
    <!-- Soil moisture -->
    <rect x="15" y="${l1y+3}" width="50" height="6" rx="3" fill="var(--border)"/>
    <rect x="15" y="${l1y+3}" width="${sm*.5}" height="6" rx="3" fill="var(--water)" opacity=".7" style="transition:width .5s"/>
    <text x="40" y="${l1y+18}" text-anchor="middle" fill="var(--dim)" style="font-size:6px;font-family:var(--body)">θ: ${sm.toFixed(0)}%</text>
    ${intv}
    <!-- Spring -->
    <circle cx="365" cy="${l2y+5}" r="5" fill="var(--spring)" opacity="${(.4+sd*.03).toFixed(2)}"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/></circle>
    <text x="365" y="${l2y+18}" text-anchor="middle" fill="var(--spring)" style="font-size:6.5px;font-family:var(--mono);font-weight:600">${sd.toFixed(2)} L/s</text>
    ${evA}${roArrow}
    <text x="8" y="14" fill="var(--dim)" style="font-size:7.5px;font-family:var(--body)">Cross-Section · ${m.slope}° · ${(m.areaM2).toLocaleString()} m²</text>
    <text x="8" y="25" fill="var(--dim)" style="font-size:6px;font-family:var(--mono)">${VEGETATION[m.vegType]?.name?.split('(')[0]||''}</text>
  </svg>`;
}

function waterBalance() {
  const r=S.results,tot=Math.max(.01,S.rainfall);
  const ro=(r.runoff/tot)*100,inf=(r.infiltration/tot)*100,ev=(r.evaporation/tot)*100;
  const dp=Math.max(0,Math.min(100-ro-inf-ev,(r.percolation/tot)*100));
  const bs=[{l:'Runoff',p:ro,c:'var(--runoff)'},{l:'Infiltration',p:inf,c:'var(--water)'},{l:'Evapotranspiration',p:ev,c:'var(--evap)'},{l:'Deep Percolation',p:dp,c:'var(--perc)'}];
  return `<div style="font-size:9.5px;color:var(--dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:1px">Water Balance (mm/hr)</div>
    <div class="wb-bar">${bs.map(b=>`<div style="width:${Math.max(1,b.p)}%;background:${b.c}"></div>`).join('')}</div>
    <div class="wbl">${bs.map(b=>`<div class="wbl-i"><div class="wbl-d" style="background:${b.c}"></div>${b.l} ${b.p.toFixed(1)}%</div>`).join('')}</div>
    <div style="margin-top:6px;font-size:9px;font-family:var(--mono);color:var(--dim)">
      Runoff: ${r.runoff.toFixed(2)} · Infil: ${r.infiltration.toFixed(2)} · ET: ${r.evaporation.toFixed(3)} · Perc: ${r.percolation.toFixed(3)} mm/hr
    </div>`;
}

    <div class="tabs">
      <button class="tb ${S.tab==='terrain'?'a':''}" data-tab="terrain">⛰ Terrain</button>
      <button class="tb ${S.tab==='geology'?'a':''}" data-tab="geology">🪨 Geology</button>
      <button class="tb ${S.tab==='weather'?'a':''}" data-tab="weather">🌧 Weather</button>
      <button class="tb ${S.tab==='interventions'?'a':''}" data-tab="interventions">🏗 Intervene</button>
      <button class="tb ${S.tab==='charts'?'a':''}" data-tab="charts">📊 Charts</button>
    </div>

    ${tc}

    <div class="ft">
      Models: SCS-CN (runoff) · Green-Ampt (infiltration) · Penman-Monteith (ET) · Boussinesq (spring Q)<br>
      Rock: GSI Uttarakhand geology · Harmonic-mean K (series flow) · Fracture permeability<br>
      Vegetation: Uttarakhand species Kc, root depth, canopy interception
    </div>`;

  bindEvents();
}

function bindEvents(){
  document.getElementById('btnR')?.addEventListener('click',toggleRun);
  document.getElementById('btnX')?.addEventListener('click',resetSim);
  document.getElementById('spd')?.addEventListener('change',e=>{S.speed=+e.target.value;if(S.running){clearInterval(S.interval);S.interval=setInterval(tick,S.speed);}});
  document.getElementById('stormTgl')?.addEventListener('click',()=>{S.stormMode=!S.stormMode;render();});

  document.querySelectorAll('.tb').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
  document.querySelectorAll('[data-soil]').forEach(b=>b.addEventListener('click',()=>{S.soilType=b.dataset.soil;sync();render();}));
  document.getElementById('vegSelect')?.addEventListener('change',e=>{S.vegType=e.target.value;sync();render();});

  // Rock selects
  for(let i=1;i<=3;i++){
    document.getElementById(`rock${i}`)?.addEventListener('change',e=>{S[`rock${i}`]=e.target.value;sync();render();});
  }

  const sMap={
    'sl-area':   [v=>{S.areaM2=v;},'m²'],
    'sl-slope':  [v=>{S.slope=v;},'°'],
    'sl-temp':   [v=>{S.temperature=v;},'°C'],
    'sl-rain':   [v=>{S.rainfall=v;if(S.model)S.model.rainfall=v;},'mm/hr'],
    'sl-r1d':    [v=>{S.rock1Depth=v;},'m'],
    'sl-r2d':    [v=>{S.rock2Depth=v;},'m'],
    'sl-r3d':    [v=>{S.rock3Depth=v;},'m'],
    'sl-pitN':   [v=>{S.pitCount=v;},'nos'],
    'sl-pitV':   [v=>{S.pitVol=v;},'m³'],
    'sl-trL':    [v=>{S.trenchLength=v;},'m'],
    'sl-trV':    [v=>{S.trenchVol=v;},'m³'],
    'sl-cdN':    [v=>{S.checkDamCount=v;},'nos'],
    'sl-cdV':    [v=>{S.checkDamVol=v;},'m³'],
    'sl-plA':    [v=>{S.plantationAreaM2=v;},'m²'],
    'sl-intD':   [v=>{S.interventionDist=v;},'m'],
  };

  for(const [id,[fn,u]] of Object.entries(sMap)){
    const el=document.getElementById(id);
    if(el){
      el.addEventListener('input',e=>{
        fn(parseFloat(e.target.value));sync();
        const h=el.parentElement.querySelector('.sg-v');
        if(h) h.textContent=`${e.target.value} ${u}`;
        const p=((e.target.value-e.target.min)/(e.target.max-e.target.min))*100;
        // Keep gradient in sync
        const cs=getComputedStyle(el);
        const bg=el.style.background;
        const colMatch=bg.match(/linear-gradient\(to right,\s*([^,]+?)\s/);
        if(colMatch) el.style.background=`linear-gradient(to right,${colMatch[1]} ${p}%,var(--border) ${p}%)`;
      });
      el.addEventListener('change',()=>{if(!S.running) render();});
    }
  }
}

// ═══════════════════════════════════════════════════
// PWA
// ═══════════════════════════════════════════════════
if('serviceWorker' in navigator){
  const sw=`const C='chirag-v2';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['/'])));self.skipWaiting();});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))));self.clients.claim();});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match('/'))));});`;
  const b=new Blob([sw],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(b)).catch(()=>{});
}
let dp;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;document.getElementById('instBan').classList.add('show');});
document.getElementById('instBtn')?.addEventListener('click',()=>{if(dp){dp.prompt();dp.userChoice.then(()=>{dp=null;document.getElementById('instBan').classList.remove('show');});}});
document.getElementById('instX')?.addEventListener('click',()=>document.getElementById('instBan').classList.remove('show'));

// Boot
S.model=mkModel();
render();
</script>
</body>
</html>
